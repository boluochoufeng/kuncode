[workspace]
members = [
    "crates/kuncode-agent",
    "crates/kuncode-cli",
    "crates/kuncode-core",
]
default-members = ["crates/kuncode-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
clap = "4.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
schemars = "1.2.1"
turso = { version = "0.7.0", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
reqwest = { version = "0.13.3", default-features = false }
thiserror = "2.0.18"
async-trait = "0.1.89"
ignore = "0.4.23"
# ripgrep's search core, as libraries. The `ripgrep` package itself publishes no
# lib target, and the `grep` facade crate would additionally pull in
# `grep-printer` (terminal rendering) and `grep-cli` (pager, tty probing) — both
# useless to a tool that returns a structured payload rather than terminal text.
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Line diffing for change previews. `default-features = false` drops the
# unicode segmentation tables, which only matter for intra-line highlighting —
# a preview shown a whole line at a time never asks for them.
similar = { version = "3.1.1", default-features = false, features = ["std", "text"] }
libc = "0.2.186"
tracing = "0.1.44"
tracing-appender = "0.2.5"
futures-core = "0.3.31"
async-stream = "0.3.6"
dotenvy = "0.15.7"
encoding_rs = "0.8.35"
html5ever = "0.39.0"
ratatui = "0.30.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
