[package]
name = "kuncode-agent"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
encoding_rs = { workspace = true }
futures-util = { workspace = true }
html5ever = { workspace = true }
ignore = { workspace = true }
kuncode-core = { path = "../kuncode-core" }
# `web_fetch` needs TLS, a pluggable resolver, and transfer compression, which
# shrinks a documentation page roughly tenfold. Its `charset` and `json` features
# only serve `Response::text()`/`json()`, which read the body whole — that tool
# caps the body as it arrives and decodes the capped bytes itself, so those
# features would buy an API it cannot call.
reqwest = { workspace = true, features = ["rustls", "gzip"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
turso = { workspace = true }
url = { workspace = true }

# `O_NOFOLLOW` has no portable spelling; the filesystem tools need it to open a
# prepared path without racing a symlink swapped in after authorization.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
